name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (${{ matrix.os }})
    # Also runs on macOS and Windows because the CLI writes into a Mendix
    # project and every Mendix developer here is on Windows. Path handling is
    # exactly the sort of thing that only breaks on someone else's machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Mendix sidecars pinned to the package version
        # Mendix rejects semver ranges and refuses to package when two
        # components disagree, so drift is a build break, not a warning.
        run: npm run sync:sidecars:check --workspace react-native-airfob

  android:
    name: Android (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache compiler and jars
        uses: actions/cache@v4
        with:
          path: packages/react-native-airfob/android/verify/.verify-cache
          key: kotlinc-${{ hashFiles('packages/react-native-airfob/android/verify/compile-check.sh') }}

      - name: Compile against real react-android classes
        run: npm run verify:android --workspace react-native-airfob

  ios:
    name: iOS (Swift)
    # The only way to compile the Swift. Until this job existed it had never
    # been through a compiler at all.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Type-check against the real iOS SDK
        run: npm run verify:ios --workspace react-native-airfob

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pack
        working-directory: packages/react-native-airfob
        run: npm pack --dry-run

      - name: Licensed binaries must never be committed
        # .gitignore blocks these, but a `git add -f` or an unanticipated path
        # would slip through, and the repo is public.
        run: |
          if git ls-files | grep -E '\.(aar|framework|xcframework)(/|$)'; then
            echo "::error::A licensed Airfob binary is tracked in git."
            exit 1
          fi
          echo "none tracked"
