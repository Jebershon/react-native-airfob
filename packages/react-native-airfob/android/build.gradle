buildscript {
    ext.safeExtGet = { prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '1.8.22')}"
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.airfob"
    compileSdkVersion safeExtGet("compileSdkVersion", 35)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
        targetSdkVersion safeExtGet("targetSdkVersion", 35)
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    lintOptions {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()

    // P5: the Airfob AAR is distributed privately. Either drop it in libs/ or
    // point this at MOCA's Maven repository once you have credentials.
    flatDir { dirs "libs" }
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${safeExtGet('kotlinVersion', '1.8.22')}"

    // Runs AirfobInitializer at process start so BLE scanning survives the JS
    // layer being torn down. Without this, tap-and-go only works while a Mendix
    // page happens to be open.
    implementation "androidx.startup:startup-runtime:1.1.1"

    // P5 — uncomment once the licensed AAR is in libs/
    // implementation(name: "airfob-sdk-2.5.38", ext: "aar")
}
