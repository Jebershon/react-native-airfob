buildscript {
    ext.safeExtGet = { prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '1.8.22')}"
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

/**
 * The licensed Airfob AAR is not in this repository and never will be. Rather
 * than a source edit to switch adapters, the build detects it: drop the AAR in
 * libs/ and the withSdk source set — which holds RealAirfobSdk and is the only
 * code that imports MOCA classes — joins the compilation.
 *
 * Without it, main/ compiles on its own against the mock, which is what keeps
 * CI green on a machine that has no licence.
 */
def airfobAars = file("libs").listFiles({ f -> f.name.endsWith(".aar") } as FileFilter)
def hasAirfobSdk = airfobAars != null && airfobAars.length > 0
logger.lifecycle(hasAirfobSdk
        ? "Airfob: SDK found (" + airfobAars*.name.join(", ") + ") — building RealAirfobSdk"
        : "Airfob: no SDK in libs/ — building against MockAirfobSdk")

android {
    namespace "com.airfob"
    compileSdkVersion safeExtGet("compileSdkVersion", 35)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
        targetSdkVersion safeExtGet("targetSdkVersion", 35)
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            if (hasAirfobSdk) {
                java.srcDirs += "src/withSdk/java"
            }
        }
    }

    lintOptions {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()

    // MOCA distribute privately: either a file drop into libs/, or their Maven
    // repository once you have credentials from an authorised dealer.
    flatDir { dirs "libs" }
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${safeExtGet('kotlinVersion', '1.8.22')}"

    // Runs AirfobInitializer at process start so BLE scanning survives the JS
    // layer being torn down. Without this, tap-and-go only works while a Mendix
    // page happens to be open.
    implementation "androidx.startup:startup-runtime:1.1.1"

    // Picked up automatically when present. Nothing to uncomment.
    if (hasAirfobSdk) {
        implementation fileTree(dir: "libs", include: ["*.aar"])
    }
}
